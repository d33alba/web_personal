<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>???</title>
<meta name="robots" content="noindex">
<!-- Tipografías: JetBrains Mono para texto (ya la usa el resto de la web) + Press Start 2P
     solo para títulos y botones, para que huela a videojuego retro sin perder legibilidad. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --w:#fff; --y:#ffd400; --r:#ff3232; --b:#5db3ff; --g:#5cff8a; --dim:#8a8a8a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:"JetBrains Mono", monospace; color:var(--w); user-select:none;
  }
  .pixel{ font-family:"Press Start 2P", monospace; }

  /* Pantalla de batalla: proporción fija, como una ventana de juego dentro de la página */
  /* altura fija (no crece con el contenido): así Débora y el alma no saltan al cambiar de escena */
  .battle{ position:relative; width:min(96vw, 700px); height:calc(min(96vw, 700px) * .75); display:flex; flex-direction:column; gap:10px; }
  .battle > *{ flex-shrink:0; }                    /* nada se aplasta: si no cabe, sobra por abajo */
  .battle.shake{ animation:shake .35s linear; }
  @keyframes shake{ 0%,100%{ transform:translate(0,0); } 20%{ transform:translate(-6px,2px); } 40%{ transform:translate(5px,-3px); } 60%{ transform:translate(-4px,3px); } 80%{ transform:translate(3px,-1px); } }

  /* ESCENAS (data-scene en #battle, ver setScene en secret.js): qué se ve en cada momento.
     dark  = negro: solo Débora, el alma y el narrador (inicio y finales)
     menu  = tu turno · box = esquivar · aim = barra de ataque · final = solo queda ATACAR */
  .hud, .dialogue, .aim, .box, .menu, .sub{ display:none; }
  .battle:is([data-scene="talk"],[data-scene="menu"],[data-scene="box"],[data-scene="aim"]) .hud{ display:flex; }
  .battle:is([data-scene="dark"],[data-scene="talk"],[data-scene="menu"]) .dialogue{ display:block; }
  .battle[data-scene="menu"] .menu:not(.off){ display:flex; }
  .battle[data-scene="menu"] .sub.show{ display:flex; }
  .battle[data-scene="aim"] .aim{ display:block; }
  .battle[data-scene="box"] .box{ display:block; }
  .battle[data-scene="box"] .boss{ flex:0 0 auto; }   /* durante los ataques sigue viéndose, justo encima de la caja */
  /* en la oscuridad del inicio, la barra y la caja ocupan su sitio sin verse: el alma flota justo donde nacerá la arena */
  .battle[data-scene="dark"] .hud{ display:flex; visibility:hidden; }
  .battle[data-scene="dark"] .box{ display:block; visibility:hidden; }
  .battle[data-scene="dark"] .boss{ flex:0 0 auto; }
  .battle[data-scene="dark"] .box{ order:1; } .battle[data-scene="dark"] .dialogue{ order:2; }
  .battle[data-scene="dark"] .btn-restart{ order:3; } .battle[data-scene="dark"] .hint{ order:4; }
  .battle[data-scene="void"] .menu{ display:flex; visibility:hidden; }   /* tras el último golpe: nada, pero sin mover a Débora */
  .battle[data-scene="final"] .menu{ display:flex; justify-content:center; }
  .battle[data-scene="final"] .menu button:not([data-act="fight"]){ display:none; }
  .battle[data-scene="final"] .menu button{ flex:0 0 260px; padding:14px 0; }

  /* Barra superior: nombre + LV + HP del jugador */
  .hud{ align-items:center; gap:14px; font-size:13px; padding:0 4px; }
  .hud b{ font-weight:500; }
  .hpbar{ width:90px; height:12px; background:#5a1010; border:1px solid var(--w); display:inline-block; vertical-align:middle; }
  .hpbar i{ display:block; height:100%; background:var(--y); transition:width .25s; }

  /* Botón de idioma, arriba a la derecha, mismo lenguaje visual que el resto de la web */
  .langBtn{
    position:absolute; top:0; right:0; width:30px; height:30px; border-radius:50%; z-index:9;
    border:1px solid var(--dim); background:#000; color:var(--w); cursor:pointer;
    display:grid; place-items:center; font-size:13px;
  }
  .langBtn:hover{ border-color:var(--w); }

  /* Débora: sprite de 96 px a x3 (bloques de 3x3). En pantallas bajas, a x2 para que quepa todo */
  .boss{ flex:1 1 0; display:flex; align-items:flex-end; justify-content:center; min-height:0; }   /* el busto se apoya en el diálogo */
  .boss__art{ width:288px; height:288px; margin-bottom:-10px; image-rendering:pixelated; image-rendering:crisp-edges; }
  .boss__art.dodge{ animation:dodge .6s cubic-bezier(.2,.8,.3,1); }
  @keyframes dodge{ 0%{ transform:translateX(0); } 25%,60%{ transform:translateX(-90px); } 100%{ transform:translateX(0); } }
  @media (max-height:700px){ .battle{ height:calc(min(96vw, 700px) * .625); } .boss__art{ width:192px; height:192px; } }

  /* Caja del NARRADOR: rectangular, con marcas de esquina. El texto entra letra a letra */
  .dialogue{
    position:relative; border:3px solid var(--w); background:#000; padding:12px 16px; min-height:64px; margin:0;
    font-size:14px; line-height:1.6; white-space:pre-wrap;
  }
  .dialogue::before, .dialogue::after{ content:''; position:absolute; width:9px; height:9px; border:var(--w) solid; opacity:.9; }
  .dialogue::before{ top:-3px; left:-3px; border-width:3px 0 0 3px; }
  .dialogue::after{ bottom:-3px; right:-3px; border-width:0 3px 3px 0; }

  /* BURBUJA de Débora: al lado de su cabeza, con la cola apuntándola */
  .bubble{
    position:absolute; z-index:7; max-width:230px; margin:0; padding:10px 12px;
    background:#fff; color:#000; font-size:13px; line-height:1.5; white-space:pre-wrap; border-radius:4px;
    animation:bubbleIn .18s ease-out;
  }
  .bubble[hidden]{ display:none; }
  .bubble::before{ content:''; position:absolute; left:-9px; top:14px; border-style:solid; border-width:6px 10px 6px 0; border-color:transparent #fff transparent transparent; }
  @keyframes bubbleIn{ from{ opacity:0; transform:translateX(-4px); } to{ opacity:1; transform:none; } }

  /* Barra de ataque: una línea recorre el objetivo y pulsas para golpear */
  .aim{ width:100%; height:92px; border:3px solid var(--w); background:#000; image-rendering:pixelated; }

  /* Caja de batalla (esquivar). Se muestra solo durante sus ataques */
  .box{ align-self:center; image-rendering:pixelated; border:3px solid var(--w); background:#000; animation:boxIn .28s ease-out; }
  .box.hit{ animation:boxShake .2s linear; }
  .box.forming{ animation:arenaGrow .7s cubic-bezier(.2,.8,.3,1); }            /* la primera vez nace alrededor del alma */
  .box.vanish{ animation:arenaVanish 1.4s steps(12) forwards; }
  @keyframes boxIn{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:scale(1); } }
  @keyframes boxShake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } }
  @keyframes arenaGrow{ from{ clip-path:inset(45% 47% 45% 47%); } to{ clip-path:inset(0); } }
  @keyframes arenaVanish{ 0%{ opacity:1; clip-path:inset(0); } 60%{ opacity:.7; clip-path:inset(20% 0 30% 0); } 100%{ opacity:0; clip-path:inset(50% 0 50% 0); } }
  .fx{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }

  /* Menú: ATACAR / ACTUAR / OBJETO / PERDÓN */
  .dialogue, .menu{ animation:softIn .22s ease-out; }
  @keyframes softIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  .menu{ gap:10px; }
  .menu button{
    flex:1; font-family:inherit; font-size:15px; padding:10px 0; cursor:pointer;
    background:#000; color:var(--w); border:3px solid var(--w);
  }
  .menu button[hidden]{ display:none; }
  .menu button[data-act="fight"]{ border-color:var(--r); color:var(--r); }
  .menu button[data-act="act"]{ border-color:var(--b); color:var(--b); }
  .menu button[data-act="item"]{ border-color:var(--g); color:var(--g); }
  .menu button[data-act="mercy"]{ border-color:var(--y); color:var(--y); }
  .menu button.is-sel{ background:currentColor; }
  .menu button.is-sel span{ color:#000; }
  .menu button.wait{ opacity:.3; cursor:default; }
  .menu button.ready{ animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 3px currentColor; } }
  /* Opción que desaparece (ruta de lucha): se rompe en franjas y se va */
  .menu button.glitch-out{ animation:glitchOut .7s steps(7) forwards; }
  @keyframes glitchOut{
    0%{ transform:none; opacity:1; clip-path:inset(0); } 30%{ transform:translateX(-6px) skewX(12deg); clip-path:inset(20% 0 40% 0); }
    60%{ transform:translateX(5px); opacity:.6; clip-path:inset(60% 0 10% 0); } 100%{ transform:scaleY(.1); opacity:0; }
  }

  /* Submenús de ACTUAR / OBJETO / PERDÓN: lista a la izquierda, descripción a la derecha */
  .sub{ border:3px solid var(--w); flex:0 0 118px; min-height:0; }
  .sub__list{ width:45%; border-right:2px solid var(--w); overflow:auto; padding:6px; }
  .sub__list button{
    display:block; width:100%; text-align:left; font-family:inherit; font-size:13px;
    background:none; color:var(--w); border:0; padding:6px 4px; cursor:pointer;
  }
  .sub__list button.is-sel{ color:var(--y); }
  .sub__list button.is-sel::before{ content:"❤ "; }
  .sub__list button:disabled{ opacity:.4; }
  .sub__desc{ flex:1; padding:10px; font-size:12px; line-height:1.7; white-space:pre-wrap; margin:0; }

  .hint{ text-align:center; font-size:10px; color:var(--dim); margin:0; min-height:14px; }

  .btn-restart{
    align-self:center; font-family:inherit; font-size:14px; padding:10px 20px; cursor:pointer;
    background:#000; color:var(--y); border:3px solid var(--y); margin-top:4px;
  }
  .btn-restart[hidden]{ display:none; }
  .btn-restart:hover{ background:var(--y); color:#000; }

  /* La última línea de código (final pacifista): se queda unos segundos y se borra */
  .codeline{
    position:absolute; left:50%; top:34%; transform:translate(-50%,-50%); z-index:8; margin:0;
    font-size:15px; color:#9fffc0; text-shadow:0 0 10px rgba(80,255,150,.45); white-space:pre;
  }
  .codeline[hidden]{ display:none; }
  .codeline i{ display:inline-block; width:.6em; height:1.1em; vertical-align:-.2em; background:#9fffc0; margin-left:2px; animation:caret 1s steps(1) infinite; }
  @keyframes caret{ 50%{ opacity:0; } }

  @media (max-width:560px){
    .hud{ font-size:11px; } .dialogue{ font-size:12px; } .bubble{ font-size:12px; max-width:180px; }
    .menu button{ font-size:12px; padding:8px 0; }
  }

  /* Derrota (te quedas sin PS): pantalla negra, el texto entra despacio en rojo */
  .gameover{
    position:absolute; inset:0; background:#000; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    opacity:0; animation:goFadeIn 1.6s ease-in forwards;
  }
  .gameover[hidden]{ display:none; }
  .gameover__title{ font-size:clamp(20px,5vw,34px); color:#c40000; letter-spacing:.08em; text-shadow:0 0 14px rgba(196,0,0,.7); margin:0; text-align:center; }
  .gameover__sub{ font-size:12px; color:#7a1414; opacity:0; animation:goFadeIn 1.2s ease-in 1.4s forwards; margin:0; }
  .gameover .btn-restart{ opacity:0; animation:goFadeIn 1s ease-in 2.4s forwards; }
  @keyframes goFadeIn{ to{ opacity:1; } }

  /* Game Over especial de la ruta de lucha: fondo rojo oscuro, letras blancas, sin música.
     YOU WON se agrieta y se convierte en DID YOU? */
  .endred{
    position:fixed; inset:0; z-index:30; background:#000; transition:background-color 3.5s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; text-align:center; padding:16px;
  }
  .endred[hidden]{ display:none; }
  .endred.red{ background:#2e0305; }
  .endred__big{ position:relative; font-size:clamp(24px,6.5vw,56px); color:#fff; letter-spacing:.06em; margin:0; opacity:0; transition:opacity 1.4s; }
  .endred__big.on{ opacity:1; }
  .endred__big.break{ animation:breakOut .7s steps(6) forwards; }
  .endred__big.glitchin{ animation:glitchIn .6s steps(5); }
  .endred__big svg{ position:absolute; left:-4%; top:-10%; width:108%; height:120%; overflow:visible; }
  .endred__big svg path{ fill:none; stroke:#2e0305; stroke-width:5; opacity:0; vector-effect:non-scaling-stroke; }   /* grietas del color del fondo */
  .endred__big.cracked svg path{ opacity:1; transition:opacity .35s steps(3); }
  @keyframes breakOut{
    0%{ transform:none; clip-path:inset(0); opacity:1; } 30%{ transform:translate(-8px,3px) skewX(-10deg); clip-path:inset(0 0 45% 0); }
    60%{ transform:translate(10px,-4px); clip-path:inset(40% 0 0 0); opacity:.7; } 100%{ transform:translateY(30px) rotate(3deg); opacity:0; }
  }
  @keyframes glitchIn{ 0%{ transform:translateX(12px) skewX(15deg); opacity:.2; } 50%{ transform:translateX(-6px); opacity:.8; } 100%{ transform:none; opacity:1; } }
  .endred__line{ font-size:15px; color:#fff; margin:0; opacity:0; transition:opacity 1.8s; }
  .endred__line.on{ opacity:1; }
  .endred .btn-restart{ color:#fff; border-color:#fff; opacity:0; transition:opacity 1.2s; }
  .endred .btn-restart:not(.on){ pointer-events:none; }
  .endred .btn-restart.on{ opacity:1; }
  .endred .btn-restart:hover{ background:#fff; color:#2e0305; }
</style>
</head>
<body>

  <div class="battle" id="battle" data-scene="dark">
    <button class="langBtn" id="langBtn" type="button" aria-label="Translate to English" title="Translate to English">EN</button>

    <!-- Derrota: solo cuando el jugador se queda sin PS -->
    <div class="gameover" id="gameOverScreen" hidden>
      <p class="gameover__title pixel" data-i18n="goTitle">* Te has quedado sin PS.</p>
      <p class="gameover__sub" data-i18n="goSub">Pero sigue intentándolo.</p>
      <button class="btn-restart" id="restartBtnGO" type="button" data-i18n="restart">↻ Jugar de nuevo</button>
    </div>

    <div class="hud">
      <span class="pixel" style="font-size:11px" data-i18n="you">TÚ</span>
      <span>LV <b id="plLv">1</b></span>
      <span>HP <span class="hpbar"><i id="plHpFill"></i></span> <b id="plHpNum">92/92</b></span>
    </div>

    <div class="boss" id="bossWrap">
      <canvas class="boss__art" id="bossCanvas" width="96" height="96"></canvas>
    </div>

    <!-- Débora habla en una burbuja; el narrador, en la caja rectangular -->
    <p class="bubble" id="bubble" hidden></p>
    <p class="dialogue" id="dialogue"></p>
    <canvas class="aim" id="aim" aria-hidden="true"></canvas>

    <canvas class="box" id="box" width="360" height="170"></canvas>
    <!-- Capa de efectos: el alma en la oscuridad, cortes, puños y manos-blaster que pueden salir fuera de la caja -->
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <p class="codeline" id="codeLine" hidden></p>

    <div class="menu" id="menu">
      <button data-act="fight"><span class="pixel" data-i18n="fight">ATACAR</span></button>
      <button data-act="act"><span class="pixel" data-i18n="act">ACTUAR</span></button>
      <button data-act="item"><span class="pixel" data-i18n="item">OBJETO</span></button>
      <button data-act="mercy"><span class="pixel" data-i18n="mercy">PERDON</span></button>
    </div>

    <div class="sub" id="actSub">
      <div class="sub__list" id="actList"></div>
      <p class="sub__desc" id="actDesc"></p>
    </div>
    <div class="sub" id="itemSub">
      <div class="sub__list" id="itemList"></div>
      <p class="sub__desc" id="itemDesc"></p>
    </div>
    <div class="sub" id="mercySub">
      <div class="sub__list" id="mercyList"></div>
      <p class="sub__desc" id="mercyDesc"></p>
    </div>

    <button class="btn-restart" id="restartBtn" type="button" hidden data-i18n="restart">↻ Jugar de nuevo</button>
    <p class="hint" id="hint"></p>
  </div>

  <!-- Game Over especial (ruta de lucha) -->
  <div class="endred" id="endRed" hidden>
    <p class="endred__big pixel" id="endBig"><span id="endBigText">YOU WON</span>
      <svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
        <path pathLength="1" d="M8 2 L19 11 L16 16 L27 24 L31 29"/>
        <path pathLength="1" d="M47 0 L44 9 L52 14 L49 22 L55 30"/>
        <path pathLength="1" d="M78 1 L73 10 L83 15 L79 23 L88 29"/>
        <path pathLength="1" d="M19 11 L33 12 L44 9"/>
        <path pathLength="1" d="M52 14 L66 17 L73 10"/>
      </svg>
    </p>
    <p class="endred__line" id="endLine"></p>
    <button class="btn-restart" id="restartBtnRed" type="button" data-i18n="restart">↻ Jugar de nuevo</button>
  </div>

  <script src="boss.js"></script>
  <script src="secret.js"></script>
</body>
</html>
