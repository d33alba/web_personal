<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>???</title>
<meta name="robots" content="noindex">
<!-- Tipografías: JetBrains Mono para texto (ya la usa el resto de la web) + Press Start 2P
     solo para títulos y botones, para que huela a videojuego retro sin perder legibilidad. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --w:#fff; --y:#ffd400; --r:#ff3232; --b:#5db3ff; --g:#5cff8a; --dim:#8a8a8a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
  body{
    display:flex; align-items:center; justify-content:center;
    font-family:"JetBrains Mono", monospace; color:var(--w); user-select:none;
  }
  .pixel{ font-family:"Press Start 2P", monospace; }

  /* Pantalla de batalla: proporción fija, como una ventana de juego dentro de la página */
  .battle{ position:relative; width:min(96vw, 700px); aspect-ratio:16/10; display:flex; flex-direction:column; gap:10px; }

  /* Barra superior: nombre + LV + HP del jugador */
  .hud{ display:flex; align-items:center; gap:14px; font-size:13px; padding:0 4px; }
  .hud b{ font-weight:500; }
  .hpbar{ width:90px; height:12px; background:#5a1010; border:1px solid var(--w); }
  .hpbar i{ display:block; height:100%; background:var(--y); }

  /* Botón de idioma, arriba a la derecha, mismo lenguaje visual que el resto de la web */
  .langBtn{
    position:absolute; top:0; right:0; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--dim); background:#000; color:var(--w); cursor:pointer;
    display:grid; place-items:center; font-size:13px;
  }
  .langBtn:hover{ border-color:var(--w); }

  /* Retrato del jefe: aquí va tu sprite (sustituye el rectángulo de marcador) */
  .boss{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  .boss__art{ width:192px; height:192px; image-rendering:pixelated; image-rendering:crisp-edges; }

  /* Marcas de esquina en el cuadro de diálogo, como en las cajas de texto de las
     batallas: un detalle pequeño que vende mucho el "esto es una interfaz de juego". */
  .dialogue{ position:relative; }
  .dialogue::before, .dialogue::after{
    content:''; position:absolute; width:9px; height:9px; border:var(--w) solid; opacity:.9;
  }
  .dialogue::before{ top:-3px; left:-3px; border-width:3px 0 0 3px; }
  .dialogue::after{ bottom:-3px; right:-3px; border-width:0 3px 3px 0; }

  /* Caja de diálogo: lo que dice el jefe. El texto entra letra a letra (ver secret.js) */
  .dialogue{
    border:3px solid var(--w); background:#000; padding:12px 16px; min-height:64px;
    font-size:14px; line-height:1.6; white-space:pre-wrap;
  }

  /* Caja de batalla (esquivar balas). Se muestra solo durante el turno del jefe */
  .box{ display:none; align-self:center; image-rendering:pixelated; border:3px solid var(--w); background:#000; }
  .box.show{ display:block; animation:boxIn .28s var(--ease, ease-out); }
  .box.hit{ animation:boxShake .2s linear; }
  @keyframes boxIn{ from{ opacity:0; transform:scale(.9); } to{ opacity:1; transform:scale(1); } }
  @keyframes boxShake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } }
  .battle.in-box .dialogue, .battle.in-box .menu{ display:none; }
  .battle.in-box .boss{ flex:0 0 0px; min-height:0; }

  /* El diálogo y el menú «entran» al aparecer, para que el cambio de turno no sea un corte seco */
  .dialogue, .menu{ animation:softIn .22s ease-out; }
  @keyframes softIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }

  /* Menú principal: FIGHT / ACT / ITEM / MERCY */
  .menu{ display:flex; gap:10px; }
  .menu[hidden]{ display:none; }                 /* oculto durante la espera previa a la pelea, ver beginBattle en secret.js */
  .menu button{
    flex:1; font-family:inherit; font-size:15px; padding:10px 0; cursor:pointer;
    background:#000; color:var(--w); border:3px solid var(--w);
  }
  .menu button[data-act="fight"]{ border-color:var(--r); color:var(--r); }
  .menu button[data-act="act"]{ border-color:var(--b); color:var(--b); }
  .menu button[data-act="item"]{ border-color:var(--g); color:var(--g); }
  .menu button[data-act="mercy"]{ border-color:var(--y); color:var(--y); }
  .menu button.is-sel{ background:currentColor; }
  .menu button.is-sel span{ color:#000; }
  .menu button:disabled{ opacity:.35; cursor:default; }
  .menu button.mercy-ready{ animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 3px var(--y); } }

  /* Submenús de ACT / ITEM / MERCY: lista a la izquierda, descripción a la derecha */
  .sub{ display:none; border:3px solid var(--w); flex:1; min-height:0; }
  .sub.show{ display:flex; }
  .sub__list{ width:45%; border-right:2px solid var(--w); overflow:auto; padding:6px; }
  .sub__list button{
    display:block; width:100%; text-align:left; font-family:inherit; font-size:13px;
    background:none; color:var(--w); border:0; padding:6px 4px; cursor:pointer;
  }
  .sub__list button.is-sel{ color:var(--y); }
  .sub__list button.is-sel::before{ content:"❤ "; }
  .sub__desc{ flex:1; padding:10px; font-size:12px; line-height:1.7; white-space:pre-wrap; }

  .hint{ text-align:center; font-size:10px; color:var(--dim); }

  .btn-restart{
    align-self:center; font-family:inherit; font-size:14px; padding:10px 20px; cursor:pointer;
    background:#000; color:var(--y); border:3px solid var(--y); margin-top:4px;
  }
  .btn-restart:hover{ background:var(--y); color:#000; }

  @media (max-width:560px){
    .hud{ font-size:11px; } .dialogue{ font-size:12px; }
    .menu button{ font-size:12px; padding:8px 0; }
  }

  /* Pantalla de derrota, al estilo de la pantalla negra de Undertale: silencio, negro,
     y el texto entra despacio en rojo. Solo se usa cuando el JUGADOR pierde (ver
     showEnding('hurt') en secret.js) — los demás finales se quedan en la caja de diálogo normal. */
  .gameover{
    position:absolute; inset:0; background:#000; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    opacity:0; animation:goFadeIn 1.6s ease-in forwards;
  }
  .gameover[hidden]{ display:none; }
  .gameover__title{
    font-size:clamp(20px,5vw,34px); color:#c40000; letter-spacing:.08em;
    text-shadow:0 0 14px rgba(196,0,0,.7);
  }
  .gameover__sub{ font-size:12px; color:#7a1414; opacity:0; animation:goFadeIn 1.2s ease-in 1.4s forwards; }
  .gameover .btn-restart{ opacity:0; animation:goFadeIn 1s ease-in 2.4s forwards; }
  @keyframes goFadeIn{ to{ opacity:1; } }
</style>
</head>
<body>

  <div class="battle" id="battle">
    <button class="langBtn" id="langBtn" type="button" aria-label="Translate to English" title="Translate to English">EN</button>

    <!-- Pantalla de derrota estilo Undertale. Oculta salvo cuando el jugador pierde. -->
    <div class="gameover" id="gameOverScreen" hidden>
      <p class="gameover__title pixel" data-i18n="goTitle">* Te has quedado sin PS.</p>
      <p class="gameover__sub" data-i18n="goSub">Pero sigue intentándolo.</p>
      <button class="btn-restart" id="restartBtnGO" type="button" data-i18n="restart">↻ Jugar de nuevo</button>
    </div>

    <div class="hud">
      <span class="pixel" style="font-size:11px" id="plName">DAVID</span>
      <span>LV <b id="plLv">1</b></span>
      <span>HP <span class="hpbar"><i id="plHpFill"></i></span> <b id="plHpNum">92/92</b></span>
    </div>

    <div class="boss" id="bossWrap">
      <canvas class="boss__art" id="bossCanvas" width="64" height="64"></canvas>
    </div>

    <p class="dialogue" id="dialogue"></p>

    <!-- Solo se ve al llegar a un final (ver showEnding en secret.js) -->
    <button class="btn-restart" id="restartBtn" type="button" hidden data-i18n="restart">↻ Jugar de nuevo</button>

    <canvas class="box" id="box" width="360" height="170"></canvas>

    <div class="menu" id="menu" hidden>
      <button data-act="fight"><span class="pixel" data-i18n="btn.fight">LUCHAR</span></button>
      <button data-act="act"><span class="pixel" data-i18n="btn.act">ACTUAR</span></button>
      <button data-act="item"><span class="pixel" data-i18n="btn.item">OBJETO</span></button>
      <button data-act="mercy"><span class="pixel" data-i18n="btn.mercy">PERDON</span></button>
    </div>

    <div class="sub" id="actSub">
      <div class="sub__list" id="actList"></div>
      <div class="sub__desc" id="actDesc"></div>
    </div>
    <div class="sub" id="itemSub">
      <div class="sub__list" id="itemList"></div>
      <div class="sub__desc" id="itemDesc"></div>
    </div>
    <div class="sub" id="mercySub">
      <div class="sub__list" id="mercyList"></div>
      <div class="sub__desc" id="mercyDesc"></div>
    </div>

    <p class="hint" data-i18n="hint">↑↓ para elegir · Enter/Espacio para confirmar · Esc para volver</p>
  </div>

  <script src="boss.js"></script>
  <script src="secret.js"></script>
</body>
</html>
